<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS Inventory</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      text-align: center;
      padding: 2rem;
      max-width: 420px;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(226, 232, 240, 0.2);
      border-top-color: #60a5fa;
      border-radius: 50%;
      margin: 0 auto 1rem;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { opacity: 0.85; font-size: 0.95rem; }
    #error { color: #fca5a5; margin-top: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 style="font-size:1.25rem;margin:0 0 .5rem;">POS Inventory</h1>
    <p id="status">Starting local application…</p>
    <p id="error"></p>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
